name: Coletar rede, leitos, profissionais e equipes (CNES)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: coleta-rede
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python3 -I -m unittest discover -s tests
      - name: Coletar
        working-directory: .
        run: python3 robo/coletar_rede.py
      - name: Coletar leitos
        if: always()
        run: python3 robo/coletar_leitos.py
      - name: Coletar equipes
        if: always()
        run: python3 robo/coletar_equipes.py
      - name: Coletar profissionais
        if: always()
        run: python3 robo/coletar_profissionais.py
      - name: Publicar resultado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "dados: rede CNES $(date -u +%d/%m/%Y\ %H:%M)"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            sleep 7
          done
          exit 1
