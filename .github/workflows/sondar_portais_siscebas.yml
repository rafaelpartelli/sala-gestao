name: Sondar portais estaduais e SisCEBAS

on:
  workflow_dispatch:
  schedule:
    - cron: "10 5 * * 1"   # segunda, 02:10 Brasilia

permissions:
  contents: write

concurrency:
  group: sondagem-portais-siscebas
  cancel-in-progress: false

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sondar portais estaduais
        run: python3 robo/sondar_portais_uf.py
      - name: Sondar SisCEBAS (somente vias abertas)
        if: always()
        run: python3 robo/sondar_siscebas.py
      - name: Publicar resultado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "dados: sondagem portais e SisCEBAS $(date -u +%d/%m/%Y\ %H:%M)"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            sleep 7
          done
          exit 1
